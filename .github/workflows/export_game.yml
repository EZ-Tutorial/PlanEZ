name: Deploy Web Build

on:
  workflow_run:
    workflows: ["GDUnit4 CI"]
    types:
      - completed
    branches: ["github-host"]

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  export_and_deploy:
    runs-on: ubuntu-latest
    
    # Check if the CI workflow was successful before running this job
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    
    environment:
      name: github-pages
      url: ${{ steps.deployment_step.outputs.page_url }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Export Godot Web build
        uses: firebellywood/godot-export@v5
        with:
          # Download URLs for the Godot engine and export templates
          godot_executable_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_linux.x86_64.zip
          godot_export_templates_download_url: https://github.com/godotengine/godot/releases/download/4.6.1-stable/Godot_v4.6.1-stable_export_templates.tpz
          relative_project_path: ./
          archive_output: false
          export_debug: false
          export_preset_name: Web
          relative_export_path: ./build/Web

      - name: Setup GitHub Pages
        uses: actions/configure-pages@v4

      - name: Upload web build artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/Web

      - name: Deploy to GitHub Pages
        id: deployment_step
        uses: actions/deploy-pages@v4